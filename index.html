<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ល្បែងក្រក (Krok)</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ល្បែងក្រក (Krok)</h1>
        <div id="krok-board"></div>
        <p id="message">Place your piece</p>
        <button id="reset-button">Reset</button>
        <div class="game-over-overlay" style="display: none;">
            <div class="game-over-content">
                <h2 class="game-over-title">Game Over</h2>
                <p class="game-over-winner">Winner: <span id="winner"></span></p>
                <button id="play-again-button" class="control-button">Play Again</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
